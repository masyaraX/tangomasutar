<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英文並べ替えトレーナー｜論理表現Ⅱ</title><style>
:root{font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;color:#192441;background:#f3f6fd}*{box-sizing:border-box}body{margin:0}.wrap{max-width:910px;margin:auto;padding:28px 16px 65px}header{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-weight:900;color:#3656c8;letter-spacing:.06em;font-size:13px}h1{font-size:clamp(25px,5vw,36px);margin:8px 0}.sub{color:#6d7893;font-size:14px}.panel{background:white;border:1px solid #e1e7f4;border-radius:22px;padding:24px;box-shadow:0 14px 40px #2b4c9910;margin-top:20px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 17px;font-weight:700;transition:.12s}button:active{transform:scale(.98)}.primary{background:#4565dc;color:#fff}.light{background:#eaf0fc;color:#3150b0}.quiet{background:#f4f6fc;color:#566480}.danger{background:#fff0f1;color:#a12f4c}.mode{background:#fff;border:1px solid #dbe2f0;padding:11px 12px;border-radius:12px;color:#243252}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{background:#edf2ff;padding:15px;border-radius:16px}.stat strong{display:block;font-size:25px}.stat small{color:#667794}.progress{height:9px;background:#e9edf8;border-radius:50px;overflow:hidden;margin:20px 0 5px}.fill{height:100%;background:#5475e5;width:0%;transition:.3s}.topline{display:flex;justify-content:space-between;align-items:center;color:#64718b;font-size:13px;font-weight:700}.number{background:#ecf1ff;border-radius:50px;padding:6px 12px;color:#4565dc}.jp{font-size:clamp(18px,3.4vw,23px);font-weight:800;line-height:1.65;margin:20px 0}.heading{font-weight:700;color:#687790;font-size:12px;letter-spacing:.08em;margin-bottom:10px}.sentence{font-size:19px;line-height:2.2;font-weight:600;overflow-wrap:anywhere}.slot{display:inline-block;min-width:90px;border-bottom:3px solid #8da3e9;color:#4565dc;text-align:center}.chosen{min-height:82px;padding:12px;background:#f2f5ff;border:2px dashed #c6d1f1;border-radius:14px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.placeholder{color:#9aa8bf;font-size:14px}.chips{display:flex;flex-wrap:wrap;gap:9px;min-height:65px}.chip{background:white;border:1px solid #b9c8ed;color:#233a80;box-shadow:0 3px 0 #dce5fa;padding:10px 13px;border-radius:11px;font-size:15px}.chip.used{opacity:.26;pointer-events:none}.chip.inanswer{background:#dde7ff;border-color:#a9bceb}.feedback{padding:17px;margin-top:16px;border-radius:14px;line-height:1.7}.ok{background:#e8f8ef;color:#136341}.bad{background:#fff0ed;color:#974335}.answer{font-weight:800;color:#21366f}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.end{text-align:center;padding:20px}.end strong{font-size:54px;color:#4565dc}.note{font-size:13px;color:#76839a;margin-top:16px}.hide{display:none!important}@media(max-width:520px){.panel{padding:18px}.stats{gap:6px}.stat{padding:10px}.stat strong{font-size:21px}button{padding:11px 13px}.sentence{font-size:16px}}
</style></head><body><main class="wrap"><header><div><div class="brand">ENGLISH REORDER TRAINER</div><h1>英文並べ替えトレーナー</h1></div><div style="font-size:42px">📘</div></header><div class="panel"><div class="controls"><select class="mode" id="mode" aria-label="出題モード"><option value="all">全20問</option><option value="wrong">苦手問題だけ</option><option value="random">全問ランダム</option></select><button class="light" id="restart">最初から</button><button class="quiet" id="resetHistory">苦手記録を消去</button></div><div class="stats"><div class="stat"><strong id="sDone">0</strong><small>解答した問題</small></div><div class="stat"><strong id="sCorrect">0</strong><small>一発正解</small></div><div class="stat"><strong id="sRate">0%</strong><small>正答率</small></div></div><div class="progress"><div id="bar" class="fill"></div></div></div><section id="card" class="panel"><div class="topline"><span class="number" id="number">問題56</span><span id="position">1 / 20</span></div><div class="jp" id="jp"></div><div class="heading">英文を完成させよう</div><div class="sentence" id="sentence"></div><div class="heading" style="margin-top:22px">選んだ語句（タップで取り消し）</div><div class="chosen" id="chosen"></div><div class="heading" style="margin-top:20px">語句を順番にタップ</div><div class="chips" id="chips"></div><div id="feedback" aria-live="polite"></div><div class="actions"><button class="primary" id="check">答え合わせ</button><button class="light" id="hint">ヒント</button><button class="quiet" id="clear">やり直し</button><button class="light hide" id="next">次の問題 →</button></div><div class="note" id="hintText"></div></section><section class="panel hide end" id="end"><h2>おつかれさま！ 🎉</h2><strong id="endScore"></strong><p id="endDesc"></p><button class="primary" id="again">もう一度チャレンジ</button><button class="light" id="review">苦手問題を復習</button></section><div class="note">PDFの問題・模範解答をもとに作成。問題64は同じ the が2つあり、どちらを先に使っても正解。学習記録はこのブラウザ内に保存されます。</div></main><script>
const DATA=[{"n": 56, "frame": "________________________ 10,000 steps a day.", "jp": "私は 1 日に 1 万歩歩くという目標を自分に課した。", "options": {"1": "myself", "2": "target", "3": "set", "4": "of", "5": "have", "6": "I", "7": "walking", "8": "a"}, "answer": [6, 5, 3, 1, 8, 2, 4, 7]}, {"n": 57, "frame": "_______________ effectively.", "jp": "彼らは効果的に夏祭りを準備した。", "options": {"1": "the", "2": "they", "3": "summer", "4": "festival", "5": "organized"}, "answer": [2, 5, 1, 3, 4]}, {"n": 58, "frame": "________________________ of street crime.", "jp": "多くの政治家が路上犯罪の問題に対処しようとしてきた。", "options": {"1": "address", "2": "the", "3": "have", "4": "to", "5": "many", "6": "politicians", "7": "problem", "8": "tried"}, "answer": [5, 6, 3, 8, 4, 1, 2, 7]}, {"n": 59, "frame": "________________________ last night.", "jp": "私たちは昨夜ひどい交通渋滞にはまって動けなかった。", "options": {"1": "were", "2": "traffic", "3": "jam", "4": "heavy", "5": "we", "6": "in", "7": "stuck", "8": "a"}, "answer": [5, 1, 7, 6, 8, 4, 2, 3]}, {"n": 60, "frame": "Traditional Japanese architecture __________________.", "jp": "伝統的な日本建築は自然災害に対してしっかりと持ちこたえることができる。", "options": {"1": "disasters", "2": "natural", "3": "stand", "4": "can", "5": "firm", "6": "against"}, "answer": [4, 3, 5, 6, 2, 1]}, {"n": 61, "frame": "_____________________.", "jp": "移民はどの社会にも新鮮な観点をもたらす。", "options": {"1": "fresh", "2": "society", "3": "perspectives", "4": "immigrants", "5": "any", "6": "to", "7": "bring"}, "answer": [4, 7, 1, 3, 6, 5, 2]}, {"n": 62, "frame": "Many farmers _____________________.", "jp": "多くの農家の人たちは生物を使って土壌を改良している。", "options": {"1": "improving", "2": "organisms", "3": "soil", "4": "their", "5": "living", "6": "using", "7": "are"}, "answer": [7, 1, 4, 3, 6, 5, 2]}, {"n": 63, "frame": "________________________ of customers.", "jp": "商店はよく客の利便性のために営業時間を延ばす。", "options": {"1": "hours", "2": "business", "3": "stores", "4": "their", "5": "convenience", "6": "for", "7": "the", "8": "often extend"}, "answer": [3, 8, 4, 2, 1, 6, 7, 5]}, {"n": 64, "frame": "________________________ in the building.", "jp": "そのアパートの居住者たちは建物内の騒音についてよく不満を言う。", "options": {"1": "the", "2": "about", "3": "noise", "4": "apartment", "5": "often complain", "6": "the", "7": "of", "8": "residents"}, "answer": [1, 8, 7, 6, 4, 5, 2, 3]}, {"n": 65, "frame": "The sharp rise ________________________.", "jp": "日本アニメの人気急上昇は世界的な現象である。", "options": {"1": "phenomenon", "2": "anime’s", "3": "Japanese", "4": "popularity", "5": "of", "6": "is", "7": "global", "8": "a"}, "answer": [5, 3, 2, 4, 6, 8, 7, 1]}, {"n": 66, "frame": "Some kinds of scientists _____________________.", "jp": "いくつかの分野の科学者は海洋化石の研究に集中している。", "options": {"1": "on", "2": "focused", "3": "researching", "4": "the", "5": "are", "6": "marine", "7": "fossils"}, "answer": [5, 2, 1, 3, 4, 6, 7]}, {"n": 67, "frame": "People believe that ________________________.", "jp": "人々は四つ葉のクローバーが幸運の象徴であると信じている。", "options": {"1": "four-leaf", "2": "the", "3": "symbol", "4": "clover", "5": "of", "6": "a", "7": "is", "8": "good luck"}, "answer": [2, 1, 4, 7, 6, 3, 5, 8]}, {"n": 68, "frame": "Japanese people ________________________.", "jp": "円高であれば，日本人は容易に海外へ旅行することができる。", "options": {"1": "is", "2": "the", "3": "overseas", "4": "yen", "5": "strong", "6": "if", "7": "can", "8": "easily travel"}, "answer": [7, 8, 3, 6, 2, 4, 1, 5]}, {"n": 69, "frame": "To improve your reading speed, __________________.", "jp": "読書のスピードを上げるには，語彙を増やす必要がある。", "options": {"1": "to", "2": "expand", "3": "your", "4": "you", "5": "need", "6": "vocabulary"}, "answer": [4, 5, 1, 2, 3, 6]}, {"n": 70, "frame": "People sometimes __________________.", "jp": "人はときにインフルエンザを普通の風邪と混同する。", "options": {"1": "confuse", "2": "common", "3": "with", "4": "cold", "5": "the", "6": "influenza"}, "answer": [1, 6, 3, 5, 2, 4]}, {"n": 71, "frame": "She _____________________.", "jp": "彼女は児童心理学を研究するために大学に入った。", "options": {"1": "psychology", "2": "study", "3": "to", "4": "entered", "5": "child", "6": "university", "7": "the"}, "answer": [4, 7, 6, 3, 2, 5, 1]}, {"n": 72, "frame": "_____________________ for the development of spacecraft.", "jp": "宇宙船の開発のための巨額の資金を集めるためにインターネットが使われた。", "options": {"1": "to", "2": "huge", "3": "used", "4": "funds", "5": "the internet", "6": "was", "7": "raise"}, "answer": [5, 6, 3, 1, 7, 2, 4]}, {"n": 73, "frame": "________________________.", "jp": "最近の経済不況は大量失業を生んだ。", "options": {"1": "the", "2": "depression", "3": "economic", "4": "mass", "5": "unemployment", "6": "recent", "7": "created", "8": "has"}, "answer": [1, 6, 3, 2, 8, 7, 4, 5]}, {"n": 74, "frame": "The couple received counseling __________________.", "jp": "その夫婦は家庭内のもめ事を解決するためにカウンセリングを受けた。", "options": {"1": "domestic", "2": "deal", "3": "with", "4": "their", "5": "to", "6": "troubles"}, "answer": [5, 2, 3, 4, 1, 6]}, {"n": 75, "frame": "_____________________ for dropping cargo.", "jp": "パラシュートの重要な軍事的使用法の 1 つは荷を投下することである。", "options": {"1": "is", "2": "military", "3": "important", "4": "one", "5": "parachutes", "6": "use", "7": "of"}, "answer": [4, 3, 2, 6, 7, 5, 1]}];let history={};try{history=JSON.parse(localStorage.getItem('reorderMistakes')||'{}')}catch{};
const $=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5);let queue=[],idx=0,picked=[],done=0,correct=0,checked=false,failed=false;
function store(){localStorage.setItem('reorderMistakes',JSON.stringify(history))}
function start(mode=$('mode').value){$('mode').value=mode;queue=DATA.filter(q=>mode!=='wrong'||history[q.n]>0);if(mode==='random')queue=shuffle(queue);idx=0;done=0;correct=0;stats();$('end').classList.add('hide');$('card').classList.remove('hide');if(!queue.length){$('card').classList.add('hide');$('end').classList.remove('hide');$('endScore').textContent='問題なし';$('endDesc').textContent='苦手問題の記録がありません。全20問で練習してみましょう。';return}show()}
function stats(){$('sDone').textContent=done;$('sCorrect').textContent=correct;$('sRate').textContent=(done?Math.round(correct/done*100):0)+'%';$('bar').style.width=(queue.length?done/queue.length*100:0)+'%'}
function full(q,ids){const words=ids.map(i=>q.options[i]).join(' ');return q.frame.replace(/_+/,words).replace(/\s+([.,!?])/g,'$1')}
function show(){let q=queue[idx];picked=[];checked=false;failed=false;$('number').textContent='問題 '+q.n;$('position').textContent=(idx+1)+' / '+queue.length;$('jp').textContent=q.jp;$('sentence').textContent=q.frame.replace(/_+/,'（ ここを並び替える ）');$('feedback').innerHTML='';$('hintText').textContent='';$('check').classList.remove('hide');$('next').classList.add('hide');const keys=shuffle(Object.keys(q.options).map(Number));$('chips').innerHTML='';keys.forEach(k=>{let b=document.createElement('button');b.className='chip';b.textContent=q.options[k];b.dataset.key=k;b.onclick=()=>{if(checked||picked.includes(k))return;picked.push(k);render()};$('chips').appendChild(b)});render()}
function render(){const q=queue[idx];$('chosen').innerHTML='';if(!picked.length){let s=document.createElement('span');s.className='placeholder';s.textContent='ここに単語を並べよう';$('chosen').appendChild(s)}picked.forEach((k,i)=>{let b=document.createElement('button');b.className='chip inanswer';b.textContent=(i+1)+'. '+q.options[k]+' ×';b.onclick=()=>{if(checked)return;picked.splice(i,1);render()};$('chosen').appendChild(b)});document.querySelectorAll('#chips .chip').forEach(b=>b.classList.toggle('used',picked.includes(Number(b.dataset.key))))}
function check(){if(checked)return;let q=queue[idx];if(picked.length!==q.answer.length){$('hintText').textContent='すべての語句を選んでから答え合わせを押してね。';return}let isok=picked.every((k,i)=>q.options[k]===q.options[q.answer[i]]);done++;if(isok&&!failed)correct++;if(!isok)history[q.n]=(history[q.n]||0)+1;else delete history[q.n];store();checked=true;stats();let fb=$('feedback');fb.className='feedback '+(isok?'ok':'bad');fb.innerHTML='<b>'+(isok?'⭕ 正解！':'❌ おしい！ 正しい順番を確認しよう')+'</b><div class="answer"></div>';fb.querySelector('.answer').textContent=full(q,q.answer);$('check').classList.add('hide');$('next').classList.remove('hide');$('next').textContent=idx===queue.length-1?'結果を見る →':'次の問題 →'}
function next(){idx++;if(idx<queue.length){show();return}$('card').classList.add('hide');$('end').classList.remove('hide');$('endScore').textContent=correct+' / '+queue.length;$('endDesc').textContent='一発正解率 '+Math.round(correct/queue.length*100)+'%。 苦手な問題は「苦手問題を復習」で繰り返し挑戦できます。'}
$('check').onclick=check;$('next').onclick=next;$('hint').onclick=()=>{let q=queue[idx];$('hintText').textContent='ヒント：最初は「'+q.options[q.answer[0]]+'」。'+(q.frame.startsWith('_')?'主語と動詞の順番に注意。':'前後の英文とのつながりに注意。')};$('clear').onclick=()=>{if(checked)return;picked=[];render();$('hintText').textContent='選択をリセットしました。'};$('restart').onclick=()=>start();$('mode').onchange=()=>start();$('again').onclick=()=>start('all');$('review').onclick=()=>start('wrong');$('resetHistory').onclick=()=>{if(confirm('苦手問題の学習記録を消去しますか？')){history={};store();start('all')}};start();
</script></body></html>
